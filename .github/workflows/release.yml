name: Release

# Pushing a tag vX.Y.Z (matching the version in Cargo.toml) builds jtk for all platforms, packages the VS Code
# extension per platform and creates a draft GitHub release. Running the workflow manually builds the same
# artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  ZIG_VERSION: "0.14.1"
  CARGO_ZIGBUILD_VERSION: "0.24.1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: built with zig against glibc 2.17, so the binaries run on nearly every distribution
          # (musl builds were much slower because of musl's allocator).
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: x86_64-unknown-linux-gnu.2.17, vscode: linux-x64, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: aarch64-unknown-linux-gnu.2.17, vscode: linux-arm64, smoke: false }
          - { os: macos-latest, target: aarch64-apple-darwin, vscode: darwin-arm64, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, vscode: darwin-x64, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, vscode: win32-x64, smoke: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, vscode: win32-arm64, smoke: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build
        run: |
          if [[ -n "${{ matrix.zig }}" ]]; then
            cargo zigbuild --release --locked --target "${{ matrix.zig }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
          echo "BIN=target/${{ matrix.target }}/release/jtk$EXE" >> "$GITHUB_ENV"

      - name: Smoke test
        if: matrix.smoke
        run: |
          "$BIN" --version
          actual=$(printf 'class A{int x=1;}' | "$BIN" format - | tr -d '\r')
          expected=$(printf 'class A {\n    int x = 1;\n}')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::unexpected output:"; echo "$actual"; exit 1
          fi

      - name: Package
        run: |
          name="jtk-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$BIN" LICENSE NOTICE README.md "dist/$name/"
          python=$(command -v python3 || command -v python)
          "$python" scripts/third-party-licenses.py --target "${{ matrix.target }}" > "dist/$name/THIRD-PARTY-LICENSES.md"
          cd dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          rm -rf "$name"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.vscode }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  vscode:
    name: VS Code extension
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: binaries
      - name: Package one VSIX per platform
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run compile
          cp ../../LICENSE .
          mkdir -p ../../dist
          for dir in ../../binaries/bin-*; do
            platform=${dir##*/bin-}
            rm -rf bin
            mkdir -p "bin/$platform"
            cp "$dir"/* "bin/$platform/"
            # Artifacts do not keep the executable bit.
            chmod +x "bin/$platform"/*
            npx vsce package --target "$platform" --out "../../dist/jtk-vscode-$VERSION-$platform.vsix"
          done
          ls -l ../../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-vscode
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
