[package]
name = "jtk"
version = "0.1.0"
edition = "2024"
description = "Java toolkit: a fast Java formatter, compatible with palantir-java-format"
license = "Apache-2.0"

[dependencies]
im-rc = "15.1.0"
regex = "1.13.1"
tree-sitter = "0.27.2"
tree-sitter-java-orchard = "0.5.25"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
