[package]
name = "jtk"
version = "0.2.3"
edition = "2024"
description = "Java toolkit: a fast Java formatter, compatible with palantir-java-format"
license = "Apache-2.0"

[dependencies]
globset = "0.4.21"
ignore = "0.4.34"
im-rc = "15.1.0"
lsp-server = "0.10.0"
lsp-types = "0.95.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
tree-sitter = "0.27.2"
tree-sitter-java-orchard = "0.5.25"

